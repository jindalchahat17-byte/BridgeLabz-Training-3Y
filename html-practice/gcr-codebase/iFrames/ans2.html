<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My City Map</title>
</head>

<body>

    <h1>My City</h1>
<!-- Loading attribute delays the loading iframe until it is required-->
    <iframe
        src="https://www.google.com/maps?q=Dehradun&output=embed"
        title="Google Map of Dehradun"
        width="600"
        height="450"
        loading="lazy">
    </iframe>

</body>
</html>
