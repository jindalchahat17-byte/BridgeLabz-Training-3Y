<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Form Submission</title>
</head>

<body>

    <h1>Submit Form</h1>

    <form action="ans17.html" target="resultFrame">

        <label for="name">Enter your name:</label>

        <input type="text"
               id="name"
               name="name"
               required>

        <input type="submit" value="Submit">

    </form>

    <br>

    <iframe
        src="about:blank"
        name="resultFrame"
        width="500"
        height="150"
        title="Form Result">
    </iframe>

</body>
</html>
