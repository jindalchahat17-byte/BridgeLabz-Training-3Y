<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact Form</title>
</head>

<body>

    <h1>Contact Us</h1>

    <form>

        <input type="text"
               name="name"
               placeholder="Enter your full name"
               required>

        <br><br>

        <input type="email"
               name="email"
               placeholder="Enter your email"
               required>

        <br><br>

        <input type="text"
               name="subject"
               placeholder="Enter subject"
               required>

        <br><br>

        <textarea name="message"
                  rows="6"
                  cols="40"
                  placeholder="Enter your message"
                  required></textarea>

        <br><br>

        <input type="submit" value="Send Message">

    </form>

</body>
</html>
