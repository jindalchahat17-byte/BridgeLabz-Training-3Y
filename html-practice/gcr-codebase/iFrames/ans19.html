<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Secure Form</title>
</head>

<body>

    <h1>Security Form</h1>

    <form autocomplete="off">

        <label for="username">Username:</label>
        <input type="text"
               id="username"
               name="username"
               required>

        <br><br>

        <label for="password">Password:</label>
        <input type="password"
               id="password"
               name="password"
               required>

        <br><br>

        <input type="submit" value="Login">

    </form>

    <p>
        Turning off autocomplete can reduce the browser's automatic
        storage and filling of sensitive information on the form.
    </p>

</body>
</html>
