<!DOCTYPE html>
<html lang="en">

<head>

    <!-- Sets the title displayed in the browser tab -->
    <title>Important Head Elements</title>

    <!-- Defines the character encoding -->
    <meta charset="UTF-8">

    <!-- Provides a description of the webpage -->
    <meta name="description"
          content="A webpage demonstrating important HTML head elements">

    <!-- Specifies the author of the webpage -->
    <meta name="author"
          content="Chahat Jindal">

    <!-- Sets the base URL for relative links -->
    <base href="https://example.com/">

    <!-- Links an external resource such as a favicon -->
    <link rel="icon" href="favicon.ico">

    <!-- Style element can contain CSS -->
    <style>
    </style>

    <!-- Script element can contain JavaScript -->
    <script>
    </script>

</head>

<body>

    <h1>Important HTML Head Elements</h1>

    <p>
        This webpage demonstrates important elements used inside
        the HTML head section.
    </p>

</body>
</html>
