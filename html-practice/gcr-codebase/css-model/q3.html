<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Gradients</title>
    <link rel="stylesheet" href="q3.css">
</head>
<body>

    <header>
        <h1>CSS Gradient Webpage</h1>
    </header>

    <main>

        <section class="linear">
            <div>
                <h2>Linear Gradient</h2>
                <p>
                    This section uses a linear gradient that changes
                    smoothly from one color to another.
                </p>
            </div>
        </section>

        <section class="radial">
            <div>
                <h2>Radial Gradient</h2>
                <p>
                    This section uses a radial gradient that spreads
                    from the center outward.
                </p>
            </div>
        </section>

    </main>

    <footer>
        <p>Gradient Demonstration Page</p>
    </footer>

</body>
</html>
