<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Height and Width</title>
    <link rel="stylesheet" href="q2.css">
</head>
<body>

    <header>
        <h1>Height & Width Practice</h1>
    </header>

    <main>
        <section class="container">

            <div class="box box1">
                <h2>Pixels</h2>
                <p>This box uses fixed pixel dimensions.</p>
            </div>

            <div class="box box2">
                <h2>Percentage</h2>
                <p>This box uses percentage width.</p>
            </div>

            <div class="box box3">
                <h2>VH & EM</h2>
                <p>This box demonstrates viewport height and em units.</p>
                <p class="extra">
                    This is extra content to demonstrate overflow property.
                    More text is added here to make the content larger.
                </p>
            </div>

        </section>
    </main>

</body>
</html>
