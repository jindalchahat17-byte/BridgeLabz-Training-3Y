<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Sizing</title>
    <link rel="stylesheet" href="q8.css">
</head>
<body>

<header>
    <h1>Box-Sizing Comparison</h1>
</header>

<main class="container">

    <section class="box default">
        <h2>Default</h2>
        <p>
            With content-box, padding and border are added
            outside the declared width.
        </p>
    </section>

    <section class="box border">
        <h2>Border-Box</h2>
        <p>
            With border-box, padding and border are included
            inside the declared width.
        </p>
    </section>

</main>

</body>
</html>
