<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Showcase</title>
    <link rel="stylesheet" href="q3.css">
</head>
<body>

<header>
    <h1>Image Showcase</h1>
</header>

<main class="gallery">

    <figure>
        <div class="image">
            <img src="https://picsum.photos/400/250?1" alt="Nature">
        </div>
        <figcaption>Beautiful Nature</figcaption>
    </figure>

    <figure>
        <div class="image">
            <img src="https://picsum.photos/400/250?2" alt="Mountain">
        </div>
        <figcaption>Mountain View</figcaption>
    </figure>

    <figure>
        <div class="image">
            <img src="https://picsum.photos/400/250?3" alt="Forest">
        </div>
        <figcaption>Green Forest</figcaption>
    </figure>

    <figure>
        <div class="image">
            <img src="https://picsum.photos/400/250?4" alt="Beach">
        </div>
        <figcaption>Peaceful Beach</figcaption>
    </figure>

    <figure>
        <div class="image">
            <img src="https://picsum.photos/400/250?5" alt="City">
        </div>
        <figcaption>Modern City</figcaption>
    </figure>

    <figure>
        <div class="image">
            <img src="https://picsum.photos/400/250?6" alt="Lake">
        </div>
        <figcaption>Beautiful Lake</figcaption>
    </figure>

</main>

</body>
</html>
