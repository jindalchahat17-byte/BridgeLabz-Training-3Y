<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Combined Effects</title>
    <link rel="stylesheet" href="q9.css">
</head>
<body>

<header>
    <h1>Combined CSS Effects</h1>
</header>

<main class="container">

    <button class="effect blue">Hover Me</button>

    <button class="effect green">Hover Me</button>

    <button class="effect red">Hover Me</button>

    <div class="card">
        <h2>Hover Card</h2>
        <p>Move your mouse over this card.</p>
    </div>

</main>

</body>
</html>
