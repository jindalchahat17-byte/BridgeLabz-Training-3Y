<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Chahat Jindal - Portfolio</title>

    <!-- Bootstrap 5 CDN -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="q2.css">
</head>

<body class="bg-light text-dark">

    <!-- Header -->
    <header class="bg-dark text-white text-center p-5">
        <div class="container">
            <h1 class="fw-bold">Chahat Jindal</h1>

            <p class="lead mb-0">
                Cloud Computing & DevOps Enthusiast
            </p>
        </div>
    </header>

    <main>

        <!-- Profile Section -->
        <section class="container mt-4 mb-3">

            <div class="text-center">

                <!-- img-fluid makes image responsive -->
                <!-- rounded-circle creates circular image -->
                <img
                    src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=300&q=80"
                    alt="Profile photo"
                    class="img-fluid rounded-circle profile-image"
                >

                <h2 class="fw-bold mt-4">
                    Hello, I'm Chahat
                </h2>

                <p class="lead">
                    I am passionate about cloud computing, DevOps,
                    web development and modern technologies.
                </p>

                <!-- Buttons -->
                <a href="#contact" class="btn btn-primary me-2">
                    Hire Me
                </a>

                <a href="#" class="btn btn-outline-dark">
                    Download CV
                </a>

            </div>

        </section>

        <!-- Contact Form -->
        <section id="contact" class="container my-5">

            <div class="card p-4 shadow-sm">

                <h3 class="text-center fw-bold mb-4">
                    Contact Me
                </h3>

                <form>

                    <div class="mb-3">
                        <label for="name" class="form-label">
                            Name
                        </label>

                        <input
                            type="text"
                            id="name"
                            class="form-control"
                            placeholder="Enter your name"
                        >
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label">
                            Email
                        </label>

                        <input
                            type="email"
                            id="email"
                            class="form-control"
                            placeholder="Enter your email"
                        >
                    </div>

                    <div class="mb-3">
                        <label for="message" class="form-label">
                            Message
                        </label>

                        <textarea
                            id="message"
                            class="form-control"
                            rows="4"
                            placeholder="Write your message"
                        ></textarea>
                    </div>

                    <button type="submit" class="btn btn-primary">
                        Send Message
                    </button>

                </form>

            </div>

        </section>

    </main>

    <footer class="bg-dark text-white text-center py-3">
        <p class="mb-0">
            &copy; 2026 Chahat Jindal
        </p>
    </footer>

</body>
</html>
