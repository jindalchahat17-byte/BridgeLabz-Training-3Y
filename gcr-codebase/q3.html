<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TechStore - Product Catalog</title>

    <!-- Bootstrap 5 CDN -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="q3.css">
</head>

<body>

    <header class="bg-dark text-white text-center py-4">
        <h1 class="fw-bold">TechStore</h1>
        <p class="mb-0">Latest Technology at Great Prices</p>
    </header>

    <main class="container py-5">

        <h2 class="text-center fw-bold mb-5">
            Featured Products
        </h2>

        <!-- row creates horizontal grid -->
        <div class="row g-4">

            <!-- col-12 = mobile, col-sm-6 = tablet, col-md-3 = desktop -->
            <div class="col-12 col-sm-6 col-md-3">
                <div class="card product-card h-100 shadow-sm">

                    <img
                        src="https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?auto=format&fit=crop&w=500&q=80"
                        class="card-img-top"
                        alt="Smartphone"
                    >

                    <div class="card-body text-center">
                        <h5 class="card-title">Smartphone Pro</h5>

                        <p class="text-primary fw-bold">
                            ₹49,999
                        </p>

                        <button class="btn btn-primary">
                            Add to Cart
                        </button>
                    </div>

                </div>
            </div>

            <div class="col-12 col-sm-6 col-md-3">
                <div class="card product-card h-100 shadow-sm">

                    <img
                        src="https://images.unsplash.com/photo-1496181133206-80ce9b88a853?auto=format&fit=crop&w=500&q=80"
                        class="card-img-top"
                        alt="Laptop"
                    >

                    <div class="card-body text-center">
                        <h5 class="card-title">Ultra Laptop</h5>

                        <p class="text-primary fw-bold">
                            ₹74,999
                        </p>

                        <button class="btn btn-primary">
                            Add to Cart
                        </button>
                    </div>

                </div>
            </div>

            <div class="col-12 col-sm-6 col-md-3">
                <div class="card product-card h-100 shadow-sm">

                    <img
                        src="https://images.unsplash.com/photo-1606220945770-b5b6c2c55bf1?auto=format&fit=crop&w=500&q=80"
                        class="card-img-top"
                        alt="Wireless headphones"
                    >

                    <div class="card-body text-center">
                        <h5 class="card-title">Wireless Headphones</h5>

                        <p class="text-primary fw-bold">
                            ₹5,999
                        </p>

                        <button class="btn btn-primary">
                            Add to Cart
                        </button>
                    </div>

                </div>
            </div>

            <div class="col-12 col-sm-6 col-md-3">
                <div class="card product-card h-100 shadow-sm">

                    <img
                        src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=500&q=80"
                        class="card-img-top"
                        alt="Smart watch"
                    >

                    <div class="card-body text-center">
                        <h5 class="card-title">Smart Watch</h5>

                        <p class="text-primary fw-bold">
                            ₹8,499
                        </p>

                        <button class="btn btn-primary">
                            Add to Cart
                        </button>
                    </div>

                </div>
            </div>

        </div>

    </main>

    <footer class="bg-dark text-white text-center py-3">
        <p class="mb-0">&copy; 2026 TechStore</p>
    </footer>

</body>
</html>
