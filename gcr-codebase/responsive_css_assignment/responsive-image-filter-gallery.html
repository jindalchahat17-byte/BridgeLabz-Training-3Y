<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Image Filter Gallery</title>
    <link rel="stylesheet" href="responsive-image-filter-gallery.css">
</head>

<body>

    <header>
        <h1>Image Filter Gallery</h1>
    </header>

    <main>
        <section class="gallery">

            <figure>
                <img class="blur"
                     src="https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=800&q=80"
                     alt="Nature">
                <figcaption>Blur Filter</figcaption>
            </figure>

            <figure>
                <img class="grayscale"
                     src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=800&q=80"
                     alt="Mountain">
                <figcaption>Grayscale Filter</figcaption>
            </figure>

            <figure>
                <img class="sepia"
                     src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=800&q=80"
                     alt="Forest">
                <figcaption>Sepia Filter</figcaption>
            </figure>

            <figure>
                <img class="brightness"
                     src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=800&q=80"
                     alt="Beach">
                <figcaption>Brightness Filter</figcaption>
            </figure>

            <figure>
                <img class="contrast"
                     src="https://images.unsplash.com/photo-1519501025264-65ba15a82390?auto=format&fit=crop&w=800&q=80"
                     alt="City">
                <figcaption>Contrast Filter</figcaption>
            </figure>

            <figure>
                <img class="hue"
                     src="https://images.unsplash.com/photo-1497250681960-ef046c08a56e?auto=format&fit=crop&w=800&q=80"
                     alt="Plants">
                <figcaption>Hue Rotate Filter</figcaption>
            </figure>

        </section>
    </main>

</body>
</html>
