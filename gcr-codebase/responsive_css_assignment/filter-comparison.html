<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filter Comparison</title>
    <link rel="stylesheet" href="filter-comparison.css">
</head>

<body>

    <main>

        <h1>Before & After Filter</h1>

        <section class="comparison">

            <figure>

                <img
                    src="https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=1000&q=80"
                    alt="Before filter">

                <figcaption>Before Filter</figcaption>

            </figure>

            <figure>

                <img
                    class="filtered"
                    src="https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=1000&q=80"
                    alt="After filter">

                <figcaption>After Filter</figcaption>

            </figure>

        </section>

    </main>

</body>
</html>
